services:
  database:
    image: pgvector/pgvector:pg16
    container_name: nimbusvault-final-db
    environment:
      POSTGRES_DB: nimbusvault
      POSTGRES_USER: nimbusvault
      POSTGRES_PASSWORD: ${NIMBUS_DB_PASSWORD:?Run setup first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nimbusvault-final-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbusvault -d nimbusvault"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  nimbusvault-final-postgres:
