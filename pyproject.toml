[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nimbusvault-ucs503p-docs"
version = "1.0.0"
description = "NimbusVault UCS503P academic documentation and journal site"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  {name = "Saras"},
  {name = "Mehul Jain"},
  {name = "Mansimar Kaur"},
]
dependencies = ["click>=8,<9"]

[project.optional-dependencies]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material>=9.5,<10",
  "mkdocs-gen-files==0.5.0",
  "mkdocs-literate-nav>=0.6,<0.7",
  "mkdocs-section-index>=0.3,<0.4",
  "mkdocs-git-revision-date-localized-plugin>=1.3,<2",
  "mkdocs-git-authors-plugin>=0.9,<1",
  "mkdocstrings[python]>=0.27,<1",
  "pymdown-extensions>=10,<11",
]

[project.urls]
Repository = "https://github.com/JainMehul05/NimbusVault-"
Template = "https://github.com/tiet-ucs503/ucs503p-202627odd-template"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["code"]
