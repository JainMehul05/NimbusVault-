site_name: NimbusVault
site_description: AI-Powered Cloud Storage & Document Intelligence Platform — Project Documentation
repo_url: https://github.com/JainMehul05/NimbusVault-
# Empty placeholder files from the project template; they would shadow the theme's directories.
exclude_docs: |
  /assets
  /journals
theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Phase 0 — Planning & Architecture:
      - SRS: phase-0/01-SRS.md
      - Architecture: phase-0/02-Architecture.md
      - Database Design: phase-0/03-Database.md
      - API Contract: phase-0/04-API.md
      - Technology Decisions: phase-0/05-Technology.md
      - Security Design: phase-0/06-Security.md
      - Scalability Design: phase-0/07-Scalability.md
      - Workflow & Standards: phase-0/08-Workflow.md
      - Testing Strategy: phase-0/09-Testing.md
      - Team Ownership: phase-0/10-Team.md
      - Roadmap: phase-0/11-Roadmap.md
  - Phase 1 — Foundation Implementation:
      - Implementation Plan: phase-1/01-phase1-implementation-plan.md
  - Phase 4 — AI Document Intelligence:
      - Architecture, Security & API: phase-4/ai-document-intelligence.md
  - Guides:
      - Status: guides/status.md
      - Architecture: guides/architecture.md
      - Local development: guides/local-development.md
      - Docker: guides/docker.md
      - Environment variables: guides/environment.md
      - Migrations: guides/migrations.md
      - API: guides/api.md
      - Security: guides/security.md
      - Troubleshooting: guides/troubleshooting.md
  - Phase 5 — AWS:
      - Architecture: phase-5/aws-architecture.md
      - Deployment: phase-5/aws-deployment.md
      - CI/CD: phase-5/ci-cd.md
      - Operations: phase-5/operations.md
      - Costs: phase-5/cost.md
  - Releases:
      - Integration report: release/integration-report.md
