site_name: "NimbusVault | UCS503P | TIET Patiala"
site_description: "NimbusVault academic reports, journals and verified application documentation"
site_url: https://jainmehul05.github.io/NimbusVault-/
repo_url: https://github.com/JainMehul05/NimbusVault-
repo_name: JainMehul05/NimbusVault-
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: assets/theme-overrides
  logo: assets/tiet-logo.svg
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - toc.integrate
  palette:
    primary: amber
    accent: orange
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - gen-files:
      scripts:
        - tools/generate_academic_docs.py
  - literate-nav:
      nav_file: summary.md
  - section-index
  - git-revision-date-localized:
      fallback_to_build_date: false
      exclude:
        - journals/**
        - academic/**
  - git-authors:
      exclude:
        - journals/**
        - academic/**
  - mkdocstrings:
      handlers:
        python:
          paths: [code/intelligence]
          options:
            show_source: false
            show_root_heading: true

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - abbr
  - md_in_html
  - attr_list
  - footnotes
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - sane_lists

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
