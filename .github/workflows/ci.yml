name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The repository is an npm workspace: there is one lockfile at the root.
jobs:
  backend:
    name: Backend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nimbusvault
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:3.5
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nimbusvault?schema=public
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_BUCKET: nimbusvault
      S3_ENDPOINT: http://localhost:4566
      S3_FORCE_PATH_STYLE: 'true'
      # AI tests use deterministic test doubles — no paid provider or key is required.
      AI_EMBEDDING_PROVIDER: none
      AI_GENERATION_PROVIDER: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./backend

      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: ./backend

      - name: Verify schema matches migrations
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        working-directory: ./backend

      - name: Create S3 bucket
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:4566/_localstack/health && break; sleep 2; done
          curl -sf -X PUT http://localhost:4566/nimbusvault

      - name: Lint
        run: npm run lint
        working-directory: ./backend

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./backend

      - name: Tests
        run: npm test -- --runInBand
        working-directory: ./backend

      - name: Build and smoke-start compiled server
        working-directory: ./backend
        env:
          NODE_ENV: production
          PORT: 3100
          JWT_ACCESS_SECRET: ci-access-secret-0123456789-abcdefghijkl
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789-abcdefghijk
        run: |
          npm run build
          node dist/main.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/api/v1/health/ready && exit 0; sleep 1; done
          exit 1

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        working-directory: ./frontend

      - name: Tests
        run: npm run test:run
        working-directory: ./frontend

      - name: Build (includes typecheck)
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:3000/api/v1

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t nimbusvault-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t nimbusvault-frontend ./frontend
