server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Slightly above the API's own 100 MB limit, so the API gives the friendly error.
  client_max_body_size 105m;
  server_tokens off;

  # Docker's DNS: resolved per request, so the API container can be recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:4566; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location /api/ {
    set $upstream ${API_UPSTREAM};
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Replaced, not appended: the client's own header must never be trusted.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    try_files $uri /index.html;
  }
}
