name: nimbusvault-ec2
x-security: &security
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
  restart: unless-stopped
  stop_grace_period: 35s

services:
  postgres:
    <<: *security
    image: nimbusvault-ec2-postgres:prepared
    build: {context: .., dockerfile: deployment/Dockerfile.postgres}
    user: postgres
    environment:
      POSTGRES_DB: nimbusvault
      POSTGRES_USER: nimbusvault
      POSTGRES_PASSWORD: ${NIMBUS_DB_PASSWORD:?Generate isolated deployment secrets}
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=30]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [application]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nimbusvault -d nimbusvault"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *security
    build: {context: .., dockerfile: deployment/Dockerfile.api}
    image: nimbusvault-ec2-api:prepared
    env_file: ["${DEPLOYMENT_ENV_FILE:?Generate isolated deployment environment}"]
    command: [node, scripts/migrate.cjs]
    networks: [application]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    restart: "no"
    mem_limit: 512m
    depends_on: {postgres: {condition: service_healthy}}

  api:
    <<: *security
    image: nimbusvault-ec2-api:prepared
    build: {context: .., dockerfile: deployment/Dockerfile.api}
    env_file: ["${DEPLOYMENT_ENV_FILE:?Generate isolated deployment environment}"]
    environment:
      INTELLIGENCE_URL: http://intelligence:8101
      BIND_HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=384
      AWS_EC2_METADATA_DISABLED: "true"
    ports: ["127.0.0.1:${HOST_APP_PORT:-3100}:3100"]
    networks: [application, access]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    mem_limit: 640m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 30
    depends_on:
      migrate: {condition: service_completed_successfully}
      intelligence: {condition: service_healthy}

  intelligence:
    <<: *security
    build: {context: .., dockerfile: deployment/Dockerfile.intelligence}
    image: nimbusvault-ec2-intelligence:prepared
    env_file: ["${INTELLIGENCE_ENV_FILE:?Generate restricted intelligence environment}"]
    environment:
      RUNTIME_MODE: container
      LLM_URL: http://ollama:11434
      AWS_AUTH_MODE: instance-role
      AWS_MIN_CREDIT_RESERVE_USD: "10"
      AWS_METADATA_SERVICE_TIMEOUT: "2"
      AWS_METADATA_SERVICE_NUM_ATTEMPTS: "1"
    volumes:
      - intelligence-data:/app/data
      - ${MODEL_ASSETS_DIR:?Supply verified model assets}/embedding-cache:/app/.runtime/standalone-ai/embedding-cache:ro
      - ${CLOUD_CONFIGURATION_DIR:?Supply sanitized resource configuration}/cloud-config.json:/app/.runtime/cloud-config.json:ro
      - ${CLOUD_CONFIGURATION_DIR:?Supply sanitized resource configuration}/cloud-resources.json:/app/.runtime/cloud-resources.json:ro
      - ${CLOUD_CONFIGURATION_DIR:?Supply approved vector fixture}/vector-demo.json:/app/.runtime/vector-demo.json:ro
    networks: [application, models, aws-egress]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 2304m
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8101/health',headers={'x-service-token':os.environ['INTERNAL_SERVICE_TOKEN']}); urllib.request.urlopen(r,timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    depends_on: {ollama: {condition: service_healthy}}

  ollama:
    <<: *security
    image: nimbusvault-ec2-ollama-cpu:prepared
    user: "10002:10002"
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 15m
      OLLAMA_CONTEXT_LENGTH: "6144"
      OLLAMA_LLM_LIBRARY: cpu
      OLLAMA_VULKAN: "0"
      CUDA_VISIBLE_DEVICES: "-1"
    volumes: ["${MODEL_ASSETS_DIR:?Supply verified model assets}/models:/models:ro"]
    networks: [models]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    mem_limit: 3584m
    cpus: 2.0
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30

networks:
  application: {internal: true}
  models: {internal: true}
  access: {}
  aws-egress: {}
volumes:
  postgres-data: {}
  intelligence-data: {}
